<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeadFlow CRM</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--bg:#f6f7fb;--panel:#fff;--panel2:#fbfcfe;--text:#172033;--muted:#788398;--line:#e7eaf0;--soft:#f0f2f6;--accent:#3157e8;--accent2:#2446c5;--danger:#d92d45;--shadow:0 12px 32px rgba(24,32,51,.08)}[data-theme=dark]{--bg:#0e1420;--panel:#151c29;--panel2:#111824;--text:#edf2fb;--muted:#8d99ad;--line:#263044;--soft:#1b2433;--accent:#6d8cff;--accent2:#8aa2ff;--danger:#ff6b7e;--shadow:0 16px 40px rgba(0,0,0,.28)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:240px;background:var(--panel);border-right:1px solid var(--line);padding:18px 13px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:4px 9px 28px;font-weight:800;font-size:15px}.mark{width:34px;height:34px;border-radius:10px;background:var(--text);color:var(--panel);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:8px;letter-spacing:.18em;margin-top:2px}.nav{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:9px;text-align:left;font-weight:700;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:var(--soft);color:var(--text)}.nav .ico{width:22px;display:inline-block}.userbox{margin-top:auto;border-top:1px solid var(--line);padding:14px 7px 3px;display:flex;gap:9px;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;background:#e8edff;color:#3b55a1;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto}.workspace{flex:1;min-width:0}.topbar{height:66px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:14px;position:sticky;top:0;z-index:5}.global-search{max-width:530px;flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid transparent;border-radius:9px;padding:9px 12px}.global-search input{border:0;outline:0;background:transparent;color:var(--text);width:100%}.top-actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:750;cursor:pointer}.btn:hover{border-color:#c8ceda}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:var(--accent2)}.iconbtn{width:36px;height:36px;padding:0;display:grid;place-items:center}.content{padding:25px 27px;max-width:1800px;margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.head h1{font-size:24px;line-height:1.2;margin:0 0 5px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(6,minmax(125px,1fr));gap:10px;margin-bottom:18px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px}.kpi label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:6px}.kpi strong{font-size:20px}.kpi .sub{font-size:10px;color:var(--muted);margin-left:5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.filters{display:flex;gap:7px;overflow:auto;min-width:0}.select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 10px}.seg{display:flex;background:var(--soft);padding:3px;border-radius:8px}.seg button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer}.seg button.on{background:var(--panel);color:var(--text);font-weight:800}.bulkbar{display:flex;align-items:center;gap:8px;background:#eef3ff;border:1px solid #d7e1ff;padding:8px 10px;border-radius:9px;margin-bottom:10px;color:#304fa7}.board{display:flex;gap:11px;overflow:auto;padding-bottom:12px}.col{min-width:276px;width:276px;background:var(--soft);border-radius:11px;padding:9px;border:1px solid transparent}.col.over{border-color:var(--accent)}.colhead{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 9px}.stage-title{font-weight:800}.stage-title .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.count{background:var(--panel);color:var(--muted);padding:3px 7px;border-radius:20px;font-size:10px;font-weight:800}.leadcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:grab;box-shadow:0 2px 5px rgba(20,30,50,.025)}.leadcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.leadcard.selected{outline:2px solid var(--accent)}.ctop{display:flex;gap:8px;align-items:flex-start}.ctop input{margin-top:2px}.ctop b{font-size:12px}.company{font-size:10px;color:var(--muted);margin:4px 0 9px}.meta{display:flex;justify-content:space-between;gap:5px;color:var(--muted);font-size:9px}.tags{margin-top:9px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}.tag{font-size:8px;font-weight:800;padding:4px 6px;border-radius:5px}.assignee{margin-left:auto}.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:9px;color:var(--muted);text-transform:uppercase;background:var(--panel2);letter-spacing:.05em}td{font-size:12px}td small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.drawerbg,.modalbg{position:fixed;inset:0;background:rgba(12,18,30,.48);z-index:30}.drawer{position:absolute;right:0;top:0;height:100%;width:430px;max-width:100%;background:var(--panel);box-shadow:-20px 0 50px rgba(0,0,0,.16);overflow:auto}.dhead{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dhead h2{font-size:20px;margin:4px 0}.dhead p{color:var(--muted);margin:0}.dactions{padding:12px 22px;border-bottom:1px solid var(--line);display:flex;gap:7px}.dbody{padding:20px}.field{margin-bottom:15px}.field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.field input,.field select,.field textarea{width:100%;margin-top:5px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:9px}.field textarea{min-height:90px;resize:vertical}.activity{border-left:2px solid var(--line);padding-left:12px}.activity div{margin-bottom:11px}.activity b{font-size:11px}.activity small{display:block;color:var(--muted);margin-top:3px}.modalbg{display:grid;place-items:center;padding:18px}.modal{width:720px;max-width:100%;max-height:92vh;overflow:auto;background:var(--panel);border-radius:13px;box-shadow:var(--shadow)}.mhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.mhead h2{margin:0;font-size:17px}.form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-weight:700;font-size:11px}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:9px}.full{grid-column:1/-1}.mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.drop{margin:20px;border:1.5px dashed #bbc4d4;border-radius:10px;padding:30px;text-align:center;cursor:pointer;color:var(--muted)}.drop strong{display:block;color:var(--text);margin:6px}.drop input{display:none}.preview{margin:0 20px 14px;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto}.import-note{padding:0 20px 12px;color:var(--muted);font-size:11px}.error{color:var(--danger);font-size:10px}.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--panel);padding:11px 15px;border-radius:9px;z-index:60;box-shadow:var(--shadow)}.empty{padding:45px;text-align:center;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;align-items:center;margin-top:9px}.row input{flex:1}.users-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.usercard{display:flex;align-items:center;gap:12px}.muted{color:var(--muted)}@media(max-width:1000px){.sidebar{width:70px}.brand span,.nav span,.userbox .usertext{display:none}.nav{text-align:center}.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.topbar{padding:0 13px}.content{padding:18px 13px}.kpis{grid-template-columns:repeat(2,1fr)}.head{display:block}.actions{margin-top:12px}.toolbar{display:block}.filters{padding-bottom:6px}.seg{margin-top:8px;width:max-content}.form,.settings-grid{grid-template-columns:1fr}.full{grid-column:auto}.drawer{width:100%}}
</style></head><body><div id="app"></div><script>
const defaultStages=[['new','New Leads','#6377e8'],['follow','Follow Up','#e6a126'],['second','Second Follow Up','#8a63d9'],['potential','Potential / Pending','#2aa9c5'],['converted','Converted','#27a66f'],['rejected','Rejected','#df5365']].map(([id,name,color],i)=>({id,name,color,position:i}));
const users=[['u1','Ali Khan','Administrator','AK'],['u2','Sara Ahmed','Sales','SA'],['u3','Hamza Malik','Sales','HM'],['u4','Ayesha Noor','Sales','AN'],['u5','Usman Raza','Sales','UR'],['u6','Maha Iqbal','Sales','MI'],['u7','Danish Raza','Sales','DR'],['u8','Hina Tariq','Sales','HT']].map(([id,name,role,avatar])=>({id,name,role,avatar,active:true}));
const defaultTags=[['hot','Hot','#e5484d'],['vip','VIP','#8b63d2'],['website','Website','#279fbe'],['callback','Callback','#d99423'],['priority','Priority','#3157e8']].map(([id,name,color])=>({id,name,color}));
const names=['Ahmed Raza','Fatima Noor','Bilal Khan','Hina Tariq','Usman Shah','Sana Malik','Hamza Ali','Areeba Javed','Zain Ahmed','Maryam Iqbal','Danish Raza','Komal Khan','Taha Ahmed','Laiba Noor','Owais Khan','Maham Ali','Rizwan Shah','Saira Ahmed'];
const companies=['TechNova','PakBuild','NorthStar Traders','BluePeak','Crescent Foods','Atlas Solutions','Vertex Digital','Prime Estates'],sources=['Meta Ads','Website','WhatsApp','Referral','Instagram'];
function load(k,d){try{return JSON.parse(localStorage.getItem('leadflow_'+k))??d}catch{return d}}function save(){localStorage.setItem('leadflow_leads',JSON.stringify(leads));localStorage.setItem('leadflow_stages',JSON.stringify(stages));localStorage.setItem('leadflow_tags',JSON.stringify(tags));localStorage.setItem('leadflow_theme',theme)}
let stages=load('stages',defaultStages),tags=load('tags',defaultTags),theme=load('theme','light');
let leads=load('leads',Array.from({length:30},(_,i)=>({id:'L'+(1000+i),name:names[i%names.length],phone:'03'+String(10+i%80).padStart(2,'0')+'-'+String(1234567+i),email:names[i%names.length].toLowerCase().replace(' ','.')+'@example.com',company:companies[i%companies.length],source:sources[i%sources.length],stageId:stages[i%stages.length].id,assignedUserId:users[i%users.length].id,tags:[defaultTags[i%defaultTags.length].id,(i%5===0?'priority':null)].filter(Boolean),notes:'Interested in pricing and next steps.',lastActivity:i%3?'Today':'Yesterday',createdAt:'2026-09-'+String(1+i%20).padStart(2,'0'),activities:[{text:'Lead created',date:'2026-09-'+String(1+i%20).padStart(2,'0')},{text:'Initial contact logged',date:i%3?'Today':'Yesterday'}]})));
let state={page:'pipeline',q:'',view:'kanban',stage:'all',user:'all',tag:'all',selected:null,modal:null,selectedIds:new Set()};let importRows=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function user(id){return users.find(x=>x.id===id)}function stage(id){return stages.find(x=>x.id===id)}function tag(id){return tags.find(x=>x.id===id)}function visible(){let q=state.q.toLowerCase();return leads.filter(l=>(!q||[l.name,l.phone,l.email,l.company,l.source].some(x=>String(x||'').toLowerCase().includes(q)))&&(state.stage==='all'||l.stageId===state.stage)&&(state.user==='all'||l.assignedUserId===state.user)&&(state.tag==='all'||(l.tags||[]).includes(state.tag)))}
function render(){save();document.documentElement.dataset.theme=theme;let f=visible();document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">LF</div><span>LeadFlow<small>LEAD CRM</small></span></div>${nav('pipeline','▦','Pipeline')}${nav('leads','☷','All Leads')}${nav('users','♙','Team')}${nav('settings','⚙','Settings')}<div class="userbox"><div class="avatar">AK</div><div class="usertext"><b>Ali Khan</b><small class="muted" style="display:block">Administrator</small></div></div></aside><main class="workspace"><header class="topbar"><div class="global-search">⌕<input placeholder="Search name, phone, email or company" value="${esc(state.q)}" oninput="state.q=this.value;render()"></div><div class="top-actions"><button class="btn iconbtn" title="Toggle theme" onclick="theme=theme==='light'?'dark':'light';render()">${theme==='light'?'☾':'☀'}</button><button class="btn iconbtn">♢</button><button class="btn primary" onclick="state.modal='add';render()">＋ Add Lead</button></div></header>${page(f)}</main></div>${state.selected?drawer(state.selected):''}${state.modal==='add'?addModal():''}${state.modal==='import'?importModal():''}`}
function nav(p,ico,label){return `<button class="nav ${state.page===p?'active':''}" onclick="go('${p}')"><span class="ico">${ico}</span><span>${label}</span></button>`}
function page(f){if(state.page==='users')return usersPage();if(state.page==='settings')return settingsPage();if(state.page==='leads')return leadsPage(f);return pipeline(f)}
function pipeline(f){let total=leads.length,converted=leads.filter(l=>stage(l.stageId)?.name.toLowerCase().includes('converted')).length,rate=total?Math.round(converted/total*100):0;return `<section class="content"><div class="head"><div><h1>Lead Pipeline</h1><p>Track every opportunity from first contact to conversion.</p></div><div class="actions"><button class="btn" onclick="state.modal='import';render()">⇧ Import</button><button class="btn" onclick="exportCSV()">⇩ Export</button></div></div><div class="kpis"><div class="kpi"><label>Total leads</label><strong>${total}</strong></div>${stages.slice(0,4).map(s=>`<div class="kpi"><label>${esc(s.name)}</label><strong>${leads.filter(l=>l.stageId===s.id).length}</strong></div>`).join('')}<div class="kpi"><label>Conversion rate</label><strong>${rate}%</strong></div></div><div class="toolbar"><div class="filters">${filterSelect('stage','Stage',stages.map(s=>[s.id,s.name]))}${filterSelect('user','Assigned',users.map(u=>[u.id,u.name]))}${filterSelect('tag','Tag',tags.map(t=>[t.id,t.name]))}<button class="btn" onclick="state.stage='all';state.user='all';state.tag='all';render()">Clear</button></div><div class="seg"><button class="${state.view==='kanban'?'on':''}" onclick="state.view='kanban';render()">Kanban</button><button class="${state.view==='table'?'on':''}" onclick="state.view='table';render()">Table</button></div></div>${state.selectedIds.size?bulkbar():''}${state.view==='kanban'?board(f):table(f)}</section>`}
function filterSelect(k,label,opts){return `<select class="select" onchange="state.${k}=this.value;render()"><option value="all">${label}: All</option>${opts.map(([v,n])=>`<option value="${esc(v)}" ${state[k]===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`}
function bulkbar(){return `<div class="bulkbar"><b>${state.selectedIds.size}</b> selected <select class="select" onchange="bulkStage(this.value)"><option value="">Change stage…</option>${stages.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><select class="select" onchange="bulkAssign(this.value)"><option value="">Assign user…</option>${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><button class="btn" onclick="bulkTag()">＋ Tag</button><button class="btn" onclick="state.selectedIds.clear();render()">Clear</button></div>`}
function board(f){return `<div class="board">${stages.map(s=>{let ls=f.filter(l=>l.stageId===s.id);return `<div class="col" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropLead(event,'${s.id}',this)"><div class="colhead"><span class="stage-title"><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span><span class="count">${ls.length}</span></div>${ls.map(card).join('')}${!ls.length?'<div class="empty">No leads</div>':''}</div>`}).join('')}</div>`}
function card(l){let checked=state.selectedIds.has(l.id);return `<article class="leadcard ${state.selected===l.id?'selected':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${l.id}')" onclick="openLead('${l.id}')"><div class="ctop"><input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleSelect('${l.id}')"><div style="flex:1"><b>${esc(l.name)}</b><div class="company">${esc(l.company||'No company')}</div></div><span class="avatar assignee">${user(l.assignedUserId)?.avatar||'?'}</span></div><div class="meta"><span>${esc(l.phone)}</span><span>${esc(l.lastActivity||'—')}</span></div><div class="tags">${(l.tags||[]).map(t=>{let x=tag(t);return x?`<span class="tag" style="color:${x.color};background:${x.color}18">${esc(x.name)}</span>`:''}).join('')}</div></article>`}
function table(f){return `<div class="tablewrap"><table><thead><tr><th><input type="checkbox" onclick="selectAll(this.checked)"></th><th>Lead</th><th>Company</th><th>Source</th><th>Stage</th><th>Assigned</th><th>Last activity</th></tr></thead><tbody>${f.map(l=>`<tr onclick="openLead('${l.id}')"><td onclick="event.stopPropagation()"><input type="checkbox" ${state.selectedIds.has(l.id)?'checked':''} onclick="toggleSelect('${l.id}')"></td><td><b>${esc(l.name)}</b><small>${esc(l.phone)} · ${esc(l.email)}</small></td><td>${esc(l.company)}</td><td>${esc(l.source)}</td><td>${esc(stage(l.stageId)?.name)}</td><td>${esc(user(l.assignedUserId)?.name)}</td><td>${esc(l.lastActivity)}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">No leads match your filters.</div></td></tr>'}</tbody></table></div>`}
function leadsPage(f){return `<section class="content"><div class="head"><div><h1>All Leads</h1><p>${f.length} visible of ${leads.length} leads.</p></div><div class="actions"><button class="btn" onclick="state.modal='import';render()">⇧ Import</button><button class="btn primary" onclick="state.modal='add';render()">＋ Add Lead</button></div></div>${bulkbarIf()}${table(f)}</section>`}function bulkbarIf(){return state.selectedIds.size?bulkbar():''}
function drawer(id){let l=leads.find(x=>x.id===id),wa=(l.phone||'').replace(/\D/g,'').replace(/^0/,'92');return `<div class="drawerbg" onclick="if(event.target===this){state.selected=null;render()}"><aside class="drawer"><div class="dhead"><div><small class="muted">LEAD ${esc(l.id)}</small><h2>${esc(l.name)}</h2><p>${esc(l.company||'')}</p></div><button class="btn iconbtn" onclick="state.selected=null;render()">×</button></div><div class="dactions"><a class="btn" href="tel:${esc(l.phone)}">☎ Call</a><a class="btn" target="_blank" href="https://wa.me/${wa}">◉ WhatsApp</a><button class="btn" onclick="addActivity('${l.id}')">＋ Activity</button></div><div class="dbody"><div class="field"><label>Phone</label><input value="${esc(l.phone)}" onchange="patch('${l.id}',{phone:this.value})"></div><div class="field"><label>Email</label><input value="${esc(l.email)}" onchange="patch('${l.id}',{email:this.value})"></div><div class="field"><label>Source</label><input value="${esc(l.source)}" onchange="patch('${l.id}',{source:this.value})"></div><div class="field"><label>Stage</label><select onchange="move('${l.id}',this.value)">${stages.map(s=>`<option value="${s.id}" ${s.id===l.stageId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Assigned user</label><select onchange="patch('${l.id}',{assignedUserId:this.value})">${users.map(u=>`<option value="${u.id}" ${u.id===l.assignedUserId?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Tags</label><select multiple style="min-height:90px" onchange="patch('${l.id}',{tags:[...this.selectedOptions].map(o=>o.value)})">${tags.map(t=>`<option value="${t.id}" ${(l.tags||[]).includes(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea onchange="patch('${l.id}',{notes:this.value})">${esc(l.notes)}</textarea></div><div class="field"><label>Activity timeline</label><div class="activity">${(l.activities||[]).slice().reverse().map(a=>`<div><b>${esc(a.text)}</b><small>${esc(a.date)}</small></div>`).join('')||'<small class="muted">No activity yet.</small>'}</div></div></div></aside></div>`}
function addModal(){return `<div class="modalbg"><div class="modal"><div class="mhead"><h2>Create new lead</h2><button class="btn iconbtn" onclick="state.modal=null;render()">×</button></div><form class="form" onsubmit="addFromForm(event)">${['name','phone','email','company'].map(k=>`<label>${k[0].toUpperCase()+k.slice(1)}<input name="${k}" ${['name','phone'].includes(k)?'required':''}></label>`).join('')}<label>Source<select name="source">${sources.map(s=>`<option>${s}</option>`).join('')}</select></label><label>Stage<select name="stageId">${stages.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>Assigned user<select name="assignedUserId">${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label><label>Tags<select name="tags" multiple style="min-height:80px">${tags.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><label class="full">Notes<textarea name="notes"></textarea></label><div class="mfoot full"><button type="button" class="btn" onclick="state.modal=null;render()">Cancel</button><button class="btn primary">Create Lead</button></div></form></div></div>`}
function importModal(){return `<div class="modalbg"><div class="modal"><div class="mhead"><div><h2>Import leads</h2><small class="muted">Excel / CSV with preview and validation</small></div><button class="btn iconbtn" onclick="state.modal=null;render()">×</button></div><div class="drop" onclick="document.getElementById('file').click()">⇧<strong>Choose .xlsx, .xls or .csv</strong><span>Recommended columns: Name, Phone, Email, Company, Source, Stage, Assigned User, Tags, Notes, Created Date</span><input id="file" type="file" accept=".xlsx,.xls,.csv" onchange="readFile(event)"></div><div id="importPreview"></div><div class="import-note">Duplicates are matched by normalized phone or email. Existing leads are updated; new rows are created.</div><div class="mfoot"><button class="btn" onclick="downloadTemplate()">⇩ Template</button><button class="btn" onclick="state.modal=null;render()">Cancel</button><button id="importBtn" class="btn primary" disabled onclick="finishImport()">Import Leads</button></div></div></div>`}
function readFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{try{let wb=XLSX.read(x.target.result,{type:'array'}),data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});importRows=data.map(row=>{let o={};Object.entries(row).forEach(([k,v])=>o[k.toLowerCase().replace(/[ _-]/g,'')]=v);return o});let valid=0,errors=0;let html='<div class="preview"><table><thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th><th>Stage</th><th>Status</th></tr></thead><tbody>';importRows.slice(0,12).forEach((r,i)=>{let er=[];if(!r.name)er.push('Name');if(!r.phone&&!r.email)er.push('Phone/email');if(er.length)errors++;else valid++;html+='<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.stage||'New Leads')+'</td><td class="'+(er.length?'error':'')+'">'+(er.length?'Missing '+er.join(', '):'Ready')+'</td></tr>'});html+='</tbody></table></div><div class="import-note"><b>'+importRows.length+'</b> rows detected · <b>'+valid+'</b> valid in preview · <b>'+errors+'</b> with errors. Rows with no name and no phone/email will be skipped.</div>';document.getElementById('importPreview').innerHTML=html;document.getElementById('importBtn').disabled=!importRows.length}catch(err){toast('Could not read this file')}};r.readAsArrayBuffer(f)}
function finishImport(){let added=0,updated=0,skipped=0;importRows.forEach(r=>{if(!r.name||(!r.phone&&!r.email)){skipped++;return}let pn=String(r.phone||'').replace(/\D/g,''),em=String(r.email||'').trim().toLowerCase();let find=leads.find(l=>(pn&&l.phone&&pn===l.phone.replace(/\D/g,''))||(em&&l.email&&em===l.email.toLowerCase()));let st=stages.find(s=>s.name.toLowerCase()===String(r.stage||'new leads').toLowerCase())||stages[0];let u=users.find(u=>u.name.toLowerCase()===String(r.assigneduser||'').toLowerCase())||users[0];let importedTags=String(r.tags||'').split(',').map(x=>x.trim().toLowerCase()).map(x=>tags.find(t=>t.name.toLowerCase()===x)?.id).filter(Boolean);let obj={name:String(r.name),phone:String(r.phone||''),email:String(r.email||''),company:String(r.company||''),source:String(r.source||'Import'),stageId:st.id,assignedUserId:u.id,tags:importedTags,notes:String(r.notes||''),lastActivity:'Imported',createdAt:String(r.createddate||new Date().toISOString().slice(0,10)),activities:[{text:'Imported from file',date:new Date().toISOString().slice(0,10)}]};if(find){Object.assign(find,obj);updated++}else{leads.unshift({id:'L'+Date.now()+Math.random().toString(16).slice(2),...obj});added++}});state.modal=null;render();toast(`Import complete · ${added} added · ${updated} updated · ${skipped} skipped`)}
function addFromForm(e){e.preventDefault();let d=Object.fromEntries(new FormData(e));let fd=new FormData(e);leads.unshift({id:'L'+Date.now(),name:d.name,phone:d.phone,email:d.email,company:d.company,source:d.source,stageId:d.stageId,assignedUserId:d.assignedUserId,tags:fd.getAll('tags'),notes:d.notes,lastActivity:'Just now',createdAt:new Date().toISOString().slice(0,10),activities:[{text:'Lead created',date:new Date().toISOString().slice(0,10)}]});state.modal=null;render();toast('Lead created')}
function patch(id,p){let l=leads.find(x=>x.id===id);Object.assign(l,p);if(p.stageId)l.activities=(l.activities||[]).concat({text:'Stage changed to '+stage(p.stageId)?.name,date:'Just now'});render();toast('Lead updated')}function move(id,s){patch(id,{stageId:s,lastActivity:'Just now'})}function addActivity(id){let t=prompt('Activity note');if(t){let l=leads.find(x=>x.id===id);l.activities=(l.activities||[]).concat({text:t,date:'Just now'});l.lastActivity='Just now';render();toast('Activity added')}}function openLead(id){state.selected=id;render()}function go(p){state.page=p;state.selected=null;state.selectedIds.clear();render()}function dropLead(e,s,el){el.classList.remove('over');move(e.dataTransfer.getData('text/plain'),s)}function toggleSelect(id){state.selectedIds.has(id)?state.selectedIds.delete(id):state.selectedIds.add(id);render()}function selectAll(v){visible().forEach(l=>v?state.selectedIds.add(l.id):state.selectedIds.delete(l.id));render()}function bulkStage(s){if(!s)return;state.selectedIds.forEach(id=>{let l=leads.find(x=>x.id===id);l.stageId=s;l.lastActivity='Bulk stage change'});state.selectedIds.clear();render();toast('Stage updated')}function bulkAssign(u){if(!u)return;state.selectedIds.forEach(id=>leads.find(x=>x.id===id).assignedUserId=u);state.selectedIds.clear();render();toast('Assignment updated')}function bulkTag(){let n=prompt('Enter tag name');let t=tags.find(x=>x.name.toLowerCase()===String(n||'').toLowerCase());if(t){state.selectedIds.forEach(id=>{let l=leads.find(x=>x.id===id);l.tags=[...new Set([...(l.tags||[]),t.id])]});state.selectedIds.clear();render();toast('Tag added')}}
function usersPage(){return `<section class="content"><div class="head"><div><h1>Team</h1><p>8 teammates · manage ownership and workload.</p></div></div><div class="users-grid">${users.map(u=>`<div class="kpi usercard"><div class="avatar">${u.avatar}</div><div><b>${esc(u.name)}</b><div class="muted">${esc(u.role)} · ${leads.filter(l=>l.assignedUserId===u.id).length} leads</div><div style="font-size:10px;margin-top:4px">● ${u.active?'Active':'Inactive'}</div></div></div>`).join('')}</div></section>`}
function settingsPage(){return `<section class="content"><div class="head"><div><h1>Settings</h1><p>Customize your pipeline and lead labels.</p></div></div><div class="settings-grid"><div class="kpi"><b>Pipeline stages</b><p class="muted">Rename, reorder, color and remove stages.</p>${stages.map((s,i)=>`<div class="row"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${s.color}"></span><input class="select" value="${esc(s.name)}" onchange="renameStage('${s.id}',this.value)"><input type="color" value="${s.color}" style="width:38px;height:35px;padding:3px" onchange="sColor('${s.id}',this.value)"><button class="btn" onclick="stageUp('${s.id}')">↑</button><button class="btn" onclick="stageDown('${s.id}')">↓</button><button class="btn" onclick="deleteStage('${s.id}')">×</button></div>`).join('')}<button class="btn primary" style="margin-top:12px" onclick="addStage()">＋ Add stage</button></div><div class="kpi"><b>Tags</b><p class="muted">Use tags for hot, VIP, callbacks and custom labels.</p>${tags.map(t=>`<div class="row"><input class="select" value="${esc(t.name)}" onchange="renameTag('${t.id}',this.value)"><input type="color" value="${t.color}" style="width:38px;height:35px;padding:3px" onchange="tColor('${t.id}',this.value)"><button class="btn" onclick="deleteTag('${t.id}')">×</button></div>`).join('')}<button class="btn primary" style="margin-top:12px" onclick="addTag()">＋ Add tag</button></div></div></section>`}
function renameStage(id,n){if(n.trim()){stage(id).name=n.trim();render()}}function sColor(id,c){stage(id).color=c;render()}function stageUp(id){let i=stages.findIndex(s=>s.id===id);if(i>0)[stages[i-1],stages[i]]=[stages[i],stages[i-1]];render()}function stageDown(id){let i=stages.findIndex(s=>s.id===id);if(i<stages.length-1)[stages[i+1],stages[i]]=[stages[i],stages[i+1]];render()}function deleteStage(id){if(stages.length<=1)return;stages=stages.filter(s=>s.id!==id);leads.forEach(l=>{if(l.stageId===id)l.stageId=stages[0].id});render();toast('Stage removed')}function addStage(){let n=prompt('Stage name');if(n)stages.push({id:'s'+Date.now(),name:n,color:'#64748b',position:stages.length}),render()}function renameTag(id,n){if(n.trim()){tag(id).name=n.trim();render()}}function tColor(id,c){tag(id).color=c;render()}function deleteTag(id){tags=tags.filter(t=>t.id!==id);leads.forEach(l=>l.tags=(l.tags||[]).filter(x=>x!==id));render()}function addTag(){let n=prompt('Tag name');if(n)tags.push({id:'t'+Date.now(),name:n,color:'#64748b'}),render()}function downloadTemplate(){let rows=[{Name:'Example Lead',Phone:'03001234567',Email:'example@email.com',Company:'Example Company',Source:'Meta Ads',Stage:'New Leads','Assigned User':'Ali Khan',Tags:'Hot, VIP',Notes:'Example note','Created Date':'2026-09-23'}];let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Leads');XLSX.writeFile(wb,'leadflow-import-template.xlsx')}function exportCSV(){let rows=visible().map(l=>({Name:l.name,Phone:l.phone,Email:l.email,Company:l.company,Source:l.source,Stage:stage(l.stageId)?.name,'Assigned User':user(l.assignedUserId)?.name,Tags:(l.tags||[]).map(t=>tag(t)?.name).filter(Boolean).join(', '),Notes:l.notes,'Created Date':l.createdAt}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Leads');XLSX.writeFile(wb,'leadflow-leads.xlsx');toast('Exported leads')}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2400)}render();
</script></body></html>
