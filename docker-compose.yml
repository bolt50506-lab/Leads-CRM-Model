services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - leadflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leadflow_postgres:
